# ملفُّ الكلمات: مصدرُ الحقيقة لتهجئة كلمات ص (دليلُ الأسلوب، القواعد ٤٢–٥١).
# يكتبه إنسان، ومنه يولّد build.rs شفرةَ Rust، ويولّد غيرُه تلوينَ المحرّر وصفحاتِ الموقع.
#
# فيه التهجئةُ وحدها. أمّا معنى النوع (عرضُه وإشارتُه وتحويلاتُه وتوليدُه) فشفرةُ Rust يدويّة
# في crates/sad_types/src/prim.rs، تشير إليه بالمعرِّف الإنجليزيّ نفسِه.
#
# القواعدُ التي يفحصها المولّد:
# - id ثابتٌ لا يُحذف ولا يُعاد، وهو اسمُ حالةِ Prim في Rust حرفًا بحرف (القاعدة ٤٧).
# - التهجئةُ بصيغة NFC، بلا محارفِ اتّجاهٍ ولا محارفَ خفيّة (القاعدة ٤٨).
# - أرقامُ الأعراض عربيّةٌ هنديّة U+0660–U+0669 وحدها، فلا U+06F0–U+06F9 ولا 0–9.
# - لا تتكرّر تهجئةٌ ولا id، ولا تطابق تهجئةٌ واحدةً من forbidden_spelling (القاعدة ٤٦).
#
# المعتمَد: ق‑٤ §١‑أ في قائمة الأنواع (قرارُ المالك ٢٠٢٦-١٠-٠٦، والأسماء ٢٠٢٦-١٠-١١).
schema = 1

# ── الأنواعُ الأوّليّة: الأعدادُ الصحيحة بإشارة (رقمي) ──
# الاسمُ المجرّد عرضُ ٦٤، فلا يُكتب عرضُه.

[[primitive_type]]
id = "I8"
spelling = "رقمي٨"

[[primitive_type]]
id = "I16"
spelling = "رقمي١٦"

[[primitive_type]]
id = "I32"
spelling = "رقمي٣٢"

[[primitive_type]]
id = "I64"
spelling = "رقمي"

# ── الأنواعُ الأوّليّة: الأعدادُ الصحيحة بلا إشارة (طبيعي) ──
# الاسمُ المجرّد عرضُ ٦٤، فلا يُكتب عرضُه.

[[primitive_type]]
id = "U8"
spelling = "طبيعي٨"

[[primitive_type]]
id = "U16"
spelling = "طبيعي١٦"

[[primitive_type]]
id = "U32"
spelling = "طبيعي٣٢"

[[primitive_type]]
id = "U64"
spelling = "طبيعي"

# ── الأنواعُ الأوّليّة: الأعدادُ العشريّة على IEEE 754 (عشري) ──
# الاسمُ المجرّد عرضُ ٦٤، فلا يُكتب عرضُه.

[[primitive_type]]
id = "F16"
spelling = "عشري١٦"

[[primitive_type]]
id = "F32"
spelling = "عشري٣٢"

[[primitive_type]]
id = "F64"
spelling = "عشري"

# ── تهجئاتٌ محظورة ──
# يرفضها المولّدُ في القوالب، ويقترح التشخيصُ بدلَها use إن وُجد.

[[forbidden_spelling]]
spelling = "رقمي٦٤"
use = "I64"
reason = "الاسمُ المجرّد هو عرضُ ٦٤، فلا يُكتب العرض"

[[forbidden_spelling]]
spelling = "طبيعي٦٤"
use = "U64"
reason = "الاسمُ المجرّد هو عرضُ ٦٤، فلا يُكتب العرض"

[[forbidden_spelling]]
spelling = "عشري٦٤"
use = "F64"
reason = "الاسمُ المجرّد هو عرضُ ٦٤، فلا يُكتب العرض"

[[forbidden_spelling]]
spelling = "عشري٨"
reason = "لا عشريَّ بعرض ٨: لا معيارَ IEEE له، وصيغُ FP8 أنواعٌ في المكتبة (قرارُ المالك ٢٠٢٦-١٠-٠٦)"
