# ملفُّ المصدر: مصدرُ الحقيقة لامتداده (ق‑١٠، ودليلُ الأسلوب، القاعدتان ٤٢ و٤٤).
# يكتبه إنسان، ومنه يولّد build.rs في sad_span الثابتَ SOURCE_EXTENSION.
#
# القواعدُ التي يفحصها المولّد:
# - المفاتيحُ المذكورة هنا وحدها (القاعدة ٥١).
# - الامتدادُ بلا نقطة، بلا محارفِ اتّجاهٍ ولا محارفَ خفيّة (القاعدة ٤٨).
schema = 1

[source_file]
extension = "ص"
