# فهرسُ الأخطاء، الملفُّ المشترك: مصدرُ الحقيقة لكلّ تشخيص (ق‑٦ و، ودليلُ الأسلوب، القواعد ٤٢–٥١).
# يكتبه إنسان، ومنه يولّد build.rs في sad_diagnostics شفرةَ Rust: تعدادَ ErrorId، ودالّةً لكلّ خطأ بمعاملاتٍ مسمّاة.
#
# الفهرسُ مجلّدٌ: هذا الملفُّ لما تشترك فيه العائلات، ولكلّ عائلةٍ ملفٌّ باسمها الإنجليزيّ بـsnake_case
# (files.toml للعائلة 700)، فيه [family] بعددها واسمها، ثمّ أخطاؤها.
#
# صيغةُ ملفّ العائلة:
#   [family]  = number (من 100 إلى 999) وname
#
# صيغةُ كلّ خطأ في ملفّ عائلته:
#   code      = الرمزُ من ستّ خانات: الثلاثُ الأولى للعائلة. ثابتٌ لا يُحذف ولا يُعاد (ق‑٦ أ، القاعدة ٤٧)
#   id        = المعرِّفُ الإنجليزيّ بـUpperCamelCase، وهو اسمُ الحالة في ErrorId. ثابتٌ لا يتغيّر
#   name      = «العائلة.الاسم»، ويجوز أن يتغيّر
#   page      = صفحةُ شرحه في الموقع: reference/errors/<اسمُ ملفّ العائلة>/<الرمز>، فلكلّ عائلةٍ تبويب (ق‑٦ ب)
#   old_names = (اختياريّ) أسماؤه القديمة، تبقى مقبولةً في الأدوات
#   severity  = error أو warning أو note
#   message   = قالبُ الرسالة، والمعاملُ فيه بين قوسين معقوفين {path}
#   params    = المعاملات: name بـsnake_case لا كلمةً محجوزة في Rust، وkind هو text (نصّ) أو count (عدد)
#               أو path (مسارٌ يبقى مسارًا حتى العرض، فيُكتب ما ليس Unicode منه بقيمته).
#               ولمعاملين فأكثر تُولَّد بنيةٌ <id>Args بأسمائها، فلا يتبادل نصّان موضعيهما
#
# القواعدُ التي يفحصها المولّد:
# - المفاتيحُ المذكورة هنا وحدها، وكلٌّ بنوعه (القاعدة ٥١).
# - لا يتكرّر رمزٌ ولا id ولا اسمٌ، قديمًا كان أو حاضرًا.
# - لا يُعاد رمزٌ ولا اسمٌ في removed (القاعدة ٤٧).
# - اسمُ الخطأ يبدأ بعائلة ملفّه. ورمزُه من عائلةٍ معلَنة، ويجوز أن تكون غيرَها: الخطأُ المنقول يحتفظ برقمه (ق‑٦ أ).
# - لا يتكرّر عددُ عائلةٍ ولا اسمُها، ولا يكون في المجلّد إلّا ملفّاتُ .toml.
# - كلُّ معاملٍ مذكورٌ في القالب مرّةً على الأقلّ، ولا يُذكر فيه غيرُ المعلَن.
# - النصوصُ بلا محارفِ اتّجاهٍ ولا محارفَ خفيّة (القاعدة ٤٨).
schema = 1

# ── الرموزُ المحذوفة: لا تُعاد أبدًا (ق‑٦ أ، القاعدة ٤٧) ──
# صيغةُ كلّ مدخل: code، وname (آخرُ اسمٍ له)، وremoved (تاريخُ الحذف)، وreason (العلّة).
# ولا رمزَ محذوفًا بعد، فالقائمةُ فارغة.
removed = []

[format]
# الأرقامُ العربيّة الهنديّة في الرسالة، واللاتينيّةُ في شفرة العرض. ويختار المشروعُ بينهما (ق‑٦ ب، القاعدة ٤).
# والرمزُ مستثنًى، فأرقامُه لاتينيّةٌ دائمًا.
digits = "٠١٢٣٤٥٦٧٨٩"

[severity]
error = "خطأ"
warning = "تحذير"
note = "ملاحظة"
