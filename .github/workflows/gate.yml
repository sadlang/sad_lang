# بوّابةُ الدمج: كلُّ خطوةٍ تمنع الدمجَ إن فشلت (دليلُ الأسلوب، القواعد ١٦ و١٧ و٢٠ و٧١ و٨١).
# المنصّاتُ المضيفة الستّ معًا، كما يطلب ق‑٧: لينكس وWindows وmacOS، كلٌّ منها بمعالجَي x64 وARM64
# (٢٠٢٦-١١-٢٧). ولا يُخفي فشلُ منصّةٍ فشلَ غيرها.
#
# أدواتُ الفرض من الفرع الأساسيّ (القاعدة ٨١): شفرةُ سكربت الفحص تُؤخذ من الفرع الأساسيّ وتُشغَّل على شجرة الطلب،
# فلا يُضعف طلبٌ الفحصَ ثمّ يمرّ به. أمّا السياساتُ (clippy_policy.toml وcrate_deps.toml) فمن الطلب نفسِه،
# فالصندوقُ الجديد وسياستُه في طلبٍ واحد، وتغييرُها لا يمرّ إلّا بموافقة المالك (CODEOWNERS، القاعدة ٢٠).
# وهذا الملفُّ نفسُه يأخذه GitHub من الطلب في pull_request، فيحرسه CODEOWNERS ومراجعةُ المالك في حماية الفرع.
#
# الإقلاع: البوّابةُ تحتاج فرعًا أساسيًّا فيه tools/checks. فأوّلُ إيداعٍ يُدفع إلى main مباشرةً.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  # تشغيلٌ شهريٌّ على أحدث الأجهزة («latest») للعلم وحده: لا يمنع دمجًا، ويُظهر ما ستكسره الترقية
  # قبل أن تُرقّى الإصداراتُ المثبَّتة بطلبٍ مقصود. وفي أوّل كلّ شهر، ويُشغَّل باليد أيضًا.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # اسمُ الفحص من اسم المنصّة لا من اسم الجهاز، فتبقى الفحوصُ اللازمة في الحماية كما هي
    # حين يُرقّى جهاز. والأجهزةُ بإصداراتٍ مثبَّتة، تُرقّى بطلبٍ مقصود لا بتحرّك «latest».
    # والتشغيلُ الشهريّ اسمُه latest (…)، فلا يُخلط بفحوص الحماية.
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'gate' || 'latest' }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-26.04
            latest: ubuntu-latest
          # لا اسمَ «latest» لأجهزة ARM على لينكس وWindows، فالتشغيلُ الشهريّ عليها بالجهاز نفسِه.
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            latest: ubuntu-24.04-arm
          # الصورةُ باسم Visual Studio فيها: windows-2025 وwindows-11-arm اسمان ينتقلان مع كلّ إصدارٍ منه،
          # فتتغيّر أدواتُ مايكروسوفت بلا طلب. وأُعلن أنّ أسماء VS 2026 يبدأ إيقافُها في ديسمبر ٢٠٢٦
          # (runner-images#15373، ولم يُؤكَّد)، فيُشغَّل التشغيلُ الشهريّ قبله ليُرى هل في صورة VS 2027 أدواتُ 14.52.
          - platform: windows-x64
            runner: windows-2025-vs2026
            latest: windows-latest
          - platform: windows-arm64
            runner: windows-11-vs2026-arm
            latest: windows-11-arm
          - platform: macos-arm64
            runner: macos-26
            latest: macos-latest
          # أحدثُ جهاز Intel في GitHub، ولم يُعلَن تاريخُ سحبه. وGitHub يترك Intel على macOS بعد خريف ٢٠٢٧،
          # والبديلُ يُحسم قبل ذلك (ق‑٧).
          - platform: macos-x64
            runner: macos-26-intel
            latest: macos-26-intel
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.runner || matrix.latest }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # لا __pycache__ في الشجرة، فلا يظهر ملفٌّ جديدٌ بعد الاختبار.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      # شفرةُ الفحص من الفرع الأساسيّ في الطلب، ومن الإيداع المدفوع نفسِه في الدفع إلى main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.sha }}
          path: _base
          sparse-checkout: tools/checks

      # إيداعُ مستودع التصميم المثبَّت في tools/checks/rules_ref.
      - name: rules ref
        id: rules
        run: echo "ref=$(grep -v '^#' tools/checks/rules_ref | head -n 1)" >> "$GITHUB_OUTPUT"

      # الموقعُ في مستودع التصميم العامّ sadlang/sad_lang_design، لفحص صفحات الأخطاء (ق‑٦ ب٣).
      - uses: actions/checkout@v7
        with:
          repository: sadlang/sad_lang_design
          ref: ${{ steps.rules.outputs.ref }}
          path: _rules
          sparse-checkout: موقع_اللغة/src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # إصدارُ Rust ومكوّناتُه من rust-toolchain.toml. وإن لم يكن rustup في الجهاز ثُبِّت من موقع Rust.
      - name: toolchain
        run: |
          if ! command -v rustup > /dev/null; then
            if [ "$RUNNER_OS" = Windows ]; then
              arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64)
              curl -sSfLo rustup-init.exe "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
              ./rustup-init.exe -y --default-toolchain none --profile minimal
              rm rustup-init.exe
            else
              curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            fi
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # فيها اختباراتُ الوحدة، والملفّاتُ المخالِفة للمولّدين، والاختباراتُ الذهبيّة لبرنامج sad.
      # ولا يوقف فشلُ صندوقٍ اختباراتِ ما بعده.
      - name: test
        run: cargo test --workspace --locked --no-fail-fast

      - name: clippy-config
        run: python _base/tools/checks/check.py --root . --policies tools/checks clippy-config --check

      - name: crate-deps
        run: python _base/tools/checks/check.py --root . --policies tools/checks crate-deps --check

      - name: error pages
        run: python _base/tools/checks/check.py --root . error-pages --site "_rules/موقع_اللغة"

      # اختباراتُ الفاحص نفسِه (القواعد ٣٨–٤١): كلُّ فحصٍ يرفض شجرةً تخالفه.
      - name: checker tests
        run: python -m unittest tools/checks/test_check.py

      # اختباراتُ سكربتَي LLVM (ق‑٧) على المنصّات الستّ، في ثوانٍ: فسكربتُ التنزيل يعمل حيث يعمل المتطوّع،
      # ولا يُشغَّل llvm.yml لتغييره. وليست أداةَ فرض، فتُؤخذ من الطلب لا من الفرع الأساسيّ.
      - name: llvm script tests
        run: python -m unittest tools/llvm_build/test_build_llvm.py

      # القاعدة ١٤: بناءان في مجلّدين جديدين يعطيان الشفرةَ المولَّدةَ نفسَها.
      - name: deterministic generated code
        run: |
          CARGO_TARGET_DIR=target/det_a cargo build --locked -p sad_diagnostics -p sad_span
          CARGO_TARGET_DIR=target/det_b cargo build --locked -p sad_diagnostics -p sad_span
          for f in catalog.rs source_file.rs; do
            a=$(find target/det_a -path "*/out/$f")
            b=$(find target/det_b -path "*/out/$f")
            [ -n "$a" ] && [ -n "$b" ] || { echo "generated $f not found"; exit 1; }
            [ "$(echo "$a" | wc -l)" -eq 1 ] && [ "$(echo "$b" | wc -l)" -eq 1 ] || { echo "ambiguous $f"; exit 1; }
            cmp "$a" "$b"
          done

      # لا CRLF ولا نهاياتٍ مختلطة في الشفرة والبيانات، إلّا الاختباراتِ الذهبيّة التي تحملها عمدًا.
      - name: line endings
        run: |
          bad=$(git ls-files --eol | grep -E 'i/(crlf|mixed)' | grep -v 'tests/diagnostics/' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

      # لا ملفَّ تغيّر ولا ملفَّ جديدًا بعد البناء والاختبار، ومنها غيرُ المتتبَّع.
      - name: no generated drift
        run: |
          changes=$(git status --porcelain -- . ':(exclude)_base' ':(exclude)_rules')
          if [ -n "$changes" ]; then echo "$changes"; exit 1; fi
